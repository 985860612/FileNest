name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build 7-Zip SDK engine
        run: ./scripts/build-engine.sh
      - name: Build WebP codec
        run: ./scripts/build-webp.sh
      - name: Run Swift and XLSX tests
        run: SEVENZIP_ENGINE_INTEGRATION=1 swift test
      - name: Verify CLI JSON contract
        run: ./scripts/cli-smoke.sh .build/debug/filenest-cli
      - name: Run archive engine smoke tests
        run: ./scripts/engine-smoke.sh
